services:
  sequencer:
    image: akshaykannan/sequencer
    # To build locally instead of pulling from Docker Hub, uncomment:
    # build: .
    ports:
      - "42716:42716"
    environment:
      # Optional: turns on AI beat generation. Keep the real value in a .env file.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Optional: turns on Google sign-in (see the README). Without it, there's one shared local account.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-10}
    volumes:
      - sequencer-data:/data
    restart: unless-stopped

volumes:
  sequencer-data:
