[package]
name = "sequencer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls + bundled Mozilla roots: HTTPS to OpenRouter validates with no CA certs
# shipped in the `scratch` runtime image. default-features=false drops the
# native-tls/OpenSSL backend so the binary stays fully static (musl).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
